<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thinker · Tarefas</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<aside class="rail"><a class="brand" href="/" aria-label="Thinker início">t<span>thinker</span></a><p class="rail-label">CONTINUIDADE</p><nav aria-label="Áreas"><button data-view="resume" aria-current="page">Retomar <span id="task-count">0</span></button><button data-view="attention">Precisa de mim <span id="attention-count">0</span></button><button data-view="deliveries">Entregas <span id="delivery-count">0</span></button></nav><div class="rail-foot"><span class="dot"></span> Consulta local<p>Seu conhecimento permanece no vault.</p></div></aside>
<main><header class="top"><span id="environment">TAREFAS</span><button id="refresh" class="quiet">Atualizar leitura</button></header><section class="intro"><p class="eyebrow" id="view-label">CONTINUE DE ONDE PAROU</p><h1 id="view-title">Retomar trabalho</h1><p id="view-description">Objetivo, correções e próximos passos, juntos na tarefa.</p><p id="freshness" class="freshness">Lendo a projeção…</p></section><div id="alert" role="status" hidden></div><div class="workspace"><section class="list-pane" aria-label="Lista de tarefas"><label class="search">Buscar tarefa<input id="search" type="search" placeholder="Nome ou objetivo" autocomplete="off"></label><div id="items"></div></section><section id="detail" class="detail" aria-label="Detalhes da tarefa"><div class="empty"><h2>Escolha uma tarefa</h2><p>Veja o que já está decidido e o que falta conferir.</p></div></section></div></main>
<div id="toast" role="status" hidden></div>
</body></html>
